version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      commitlint:
        patterns: ['@commitlint/*']
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
